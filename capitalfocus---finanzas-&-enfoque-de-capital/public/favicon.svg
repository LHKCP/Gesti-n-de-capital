<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171f33"/>
      <stop offset="100%" stop-color="#0b1326"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4edea3"/>
      <stop offset="100%" stop-color="#00e599"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Glowing background aura -->
  <circle cx="256" cy="256" r="140" fill="#4edea3" opacity="0.12" filter="url(#glow)"/>

  <!-- Icon: Modern Capital Vault / Diamond Focus -->
  <g transform="translate(116, 116) scale(0.55)" fill="none" stroke="url(#emeraldGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Shield / Vault -->
    <path d="M256 40 L440 120 L440 280 C440 380 360 450 256 480 C152 450 72 380 72 280 L72 120 Z" fill="rgba(78, 222, 163, 0.08)" />
    <!-- Inner Diamond -->
    <polygon points="256,150 350,260 256,370 162,260" fill="url(#emeraldGrad)" opacity="0.9" />
    <circle cx="256" cy="260" r="28" fill="#0b1326" />
  </g>
</svg>
